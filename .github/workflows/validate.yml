# Jason Stys: independent core, browser and genuine two-version PX4 fault acceptance; no artifact/cache uploads.
name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12', sanitize: 'OFF'}
          - {os: ubuntu-24.04, python: '3.14', sanitize: 'ON'}
          - {os: windows-latest, python: '3.14', sanitize: 'OFF'}
          - {os: macos-latest, python: '3.14', sanitize: 'OFF'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: npm ci --ignore-scripts
      - run: python -m ruff check assurance tests tools
      - run: python -m ruff format --check assurance tests tools
      - run: python tools/schema.py --check
      - run: python tools/docs_index.py --check
      - run: python -m pytest --cov=assurance --cov-report=term-missing
      - run: cmake -S . -B .runtime/build -DCMAKE_BUILD_TYPE=Release -DLAB_SANITIZE=${{ matrix.sanitize }}
      - run: cmake --build .runtime/build --config Release --parallel 2
      - run: ctest --test-dir .runtime/build -C Release --output-on-failure -V
      - run: npm run format:check && npm test && npm run build
      - run: python tools/check_repo.py --dist
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: python -m pip_audit --disable-pip --no-deps -r requirements.lock
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: npm run audit
  browser:
    name: Production viewer / Chromium Firefox WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --ignore-scripts && npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
  native:
    name: Genuine PX4 ${{ matrix.version }} / eight fault scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1.16.1', commit: '94cb2012792b2ae89f0b147cfee53ee31ae550be'}
          - {version: '1.17.0', commit: 'd6f12ad1c4f70ad3230afd7d86e971421e02fef4'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PX4/PX4-Autopilot
          ref: '${{ matrix.commit }}'
          path: .runtime/px4
          submodules: recursive
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build bc libeigen3-dev
      - run: python -m pip install --require-hashes -r requirements-native.lock
      - run: cmake -S . -B .runtime/build -DCMAKE_BUILD_TYPE=Release && cmake --build .runtime/build --parallel 2
      - name: Compile actual pinned autopilot
        run: make -C .runtime/px4 px4_sitl_default -j2
      - name: Independent native fault and recovery acceptance
        run: python -m assurance.runner --version ${{ matrix.version }}
      - name: Show owned simulator diagnostics on failure
        if: failure()
        run: |
          for file in .runtime/px4-boot-*.log; do
            if [ -f "$file" ]; then tail -n 70 "$file"; fi
          done
      - name: Audit native dependency lock
        run: python -m pip_audit --disable-pip --no-deps -r requirements-native.lock
